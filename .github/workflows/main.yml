name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --no-daemon

      - name: list built files
        run: ls -l build/libs/

      - name: upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: LootSurge-mod-jar
          path: |
            build/libs/lootsurge-*.jar
            !build/libs/lootsurge-*-sources.jar
          if-no-files-found: error

      - name: attach the jar to a GitHub Release (tags like v1.0.0 only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/lootsurge-*.jar | grep -v -- '-sources.jar' | head -n 1)
          gh release create "${GITHUB_REF_NAME}" "$JAR" --title "Loot Surge ${GITHUB_REF_NAME}" --generate-notes
